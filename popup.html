<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PokerNow Stats HUD</title><link rel="stylesheet" href="popup.css"></head>
  <body><main>
    <h1>PokerNow Stats HUD</h1>
    <p id="pnhud-popup-status" role="status" aria-live="polite">Loading HUD state…</p>
    <button id="pnhud-toggle-hud" type="button" aria-pressed="false" disabled>HUD on/off</button>
    <button id="pnhud-open-settings" type="button">Open Settings</button>
    <p id="pnhud-popup-feedback" role="status" aria-live="polite">Settings opens on your active PokerNow table.</p>
    <p id="pnhud-compatibility-scope" hidden>Compatibility build · V1.5 live tracking</p>
    <p class="build-id" id="pnhud-popup-build-id">Build unavailable</p>
  </main><script src="runtimeScope.js"></script><script src="settingsUi.js"></script><script src="popup.js"></script></body>
</html>
