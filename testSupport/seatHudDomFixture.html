<!doctype html><html><head><meta charset="utf-8"><title>Seat HUD painted identity and nested-panel verification</title><link rel="stylesheet" href="/hud.css"><style>
*{box-sizing:border-box}body{margin:0;background:#15362c;color:#e8fff5;font:13px system-ui;overflow:hidden}button{cursor:pointer;padding:5px 9px}header{position:fixed;z-index:2147483647;top:0;background:#0c201b;width:100%;padding:7px;display:flex;gap:5px;flex-wrap:wrap}#results{position:fixed;bottom:0;left:0;z-index:2147483647;max-width:100%;background:#081b16;white-space:pre-wrap;font:11px monospace;padding:7px;pointer-events:none}#native-app{position:absolute;inset:65px 0 50px;isolation:isolate;transform:translateZ(0);z-index:1}#table{position:absolute;inset:40px 120px;border:8px solid #6d5335;border-radius:45%;background:#205744}.seat{position:absolute;width:260px;height:130px}.table-player-name{position:absolute;left:0;top:55px;width:230px;height:25px;background:#293d36}.table-player-name a{display:block;width:215px;color:white;text-decoration:none;padding-left:12px}.badge{position:absolute;left:180px;color:gold}.table-player-stack{position:absolute;left:0;top:80px;width:225px;text-align:right;padding-right:24px}.table-player-cards{position:absolute;left:15px;top:0;width:65px;height:49px;background:#d7dad9;border-radius:5px;color:#143126;text-align:center;font-size:24px}.avatar{position:absolute;left:24px;top:5px;border:2px solid #637b78;width:40px;height:40px;border-radius:50%;display:none}.action-fold{position:absolute;left:232px;top:45px;color:#f59d80}.trophy{position:absolute;left:-35px;top:10px;color:gold}#chat{position:absolute;right:0;top:40px;width:230px;height:360px;background:#172932;padding:12px}#launcher{position:absolute;left:40%;top:45px}#expanded,#account-menu{position:absolute;left:100px;top:80px;width:min(540px,65vw);height:330px;background:white;color:#202828;border:1px solid #aaa;overflow:auto;padding:12px;box-shadow:0 10px 35px #0008}#account-menu{left:44%;width:290px;height:260px}.native-action{display:block;width:100%;position:absolute;left:0;top:110px;height:36px;background:#bedfc9}.panel-spacer{height:650px;pointer-events:none}#settings{position:fixed;z-index:2147483647;top:100px;left:25%;width:50%;height:260px;background:#122930;border:2px solid #50dab7;padding:20px}#game-settings{position:fixed;z-index:2147483646;top:100px;left:25%;width:50%;height:260px;background:white;color:black}.pnhud-seat-overlay{width:190px!important;height:32px!important}.target{font-size:11px}.pnhud-player-name{max-width:70px!important}
.seat:nth-child(3n+2) .avatar{display:block;background:#70857c}.seat:nth-child(3n+2) .table-player-cards{display:none}
</style></head><body>
<header><button id="run">Run matrix</button><select id="count" aria-label="Seats"><option>2</option><option>3</option><option>4</option><option>6</option><option selected>9</option></select><button id="reset">Reset</button><button id="remount">Replace name/card nodes</button><button data-panel="Session Log">Show Session Log</button><button data-panel="Ledger">Show Ledger</button><button data-panel="Replayer">Show Replayer</button><button data-panel="menu">Show account menu</button><button id="close">Close panels</button><button id="settings-toggle">HUD Settings</button><button id="game-toggle">Game Settings</button></header>
<div id="native-app"><div id="table"></div><aside id="chat">Chat (ordinary lower layer)</aside><button id="launcher">LOG / LEDGER</button><div id="seats"></div>
<section id="expanded" class="session-log-panel" hidden><nav><button data-tab="Session Log">SESSION LOG</button><button data-tab="Ledger">Ledger</button><button data-tab="Replayer">Replayer</button><button class="native-close">Close</button></nav><p>Nested inside transformed, isolated app at z-index 1.</p><button class="native-action">Panel action / play</button><div class="panel-spacer"></div><button class="bottom-action">Bottom scroll action</button></section>
<section id="account-menu" class="account-game-menu" hidden><button>Preferences</button><button>Video/Audio</button><button class="native-close">Close</button><button class="native-action">Game Configurations</button><div class="panel-spacer"></div><button class="bottom-action">Menu bottom action</button></section></div>
<div id="pnhud-overlay-root"></div><section id="settings" hidden>Extension HUD Settings: Seat HUD root blocked.</section><section id="game-settings" role="dialog" aria-label="Game Settings" hidden>Game Settings</section><output id="results"></output>
<script src="/playerProfileClassifier.js"></script><script src="/playerProfilePresentation.js"></script><script src="/playerProfileExplanation.js"></script><script src="/overlayStats.js"></script><script src="/seatOverlay.js"></script><script src="/runtime.js"></script><script>
const root=document.getElementById('pnhud-overlay-root'),seatRoot=document.getElementById('seats'),result=document.getElementById('results');
let count=9, api, checks=[],clicks=0,hudClicks=0,shift=0,active=null;
const expanded=document.getElementById('expanded'),menu=document.getElementById('account-menu');
function output(){if(!api)return;const first=api.records.get('p0'),r=first&&first.element.getBoundingClientRect(),panel=active&&active.getBoundingClientRect();result.textContent=checks.join('\n')+'\nSeats '+count+' | Panel clicks '+clicks+' | HUD clicks '+hudClicks+' | offset0 '+JSON.stringify(api.offsets().p0||{offsetX:0,offsetY:0})+'\n'+(r?'Grip center '+Math.round(r.left+8)+','+Math.round(r.top+16):'')+(panel?' | overlap click '+Math.round(panel.right-10)+','+Math.round(panel.top+125)+' | scrollTop '+active.scrollTop:'')+'\n'+JSON.stringify(api.state());}
api=createSeatHudFixtureRuntime(root,()=>layout(),()=>{hudClicks++;output();});
function render(n){count=n;seatRoot.innerHTML='';root.innerHTML='';api.records.clear();for(let i=0;i<n;i++){let angle=-Math.PI/2+i*2*Math.PI/n,cx=innerWidth/2+Math.cos(angle)*(innerWidth*.33),cy=(innerHeight-130)/2+Math.sin(angle)*(innerHeight*.26);let seat=document.createElement('div');seat.className='seat';seat.style.left=(cx-45)+'px';seat.style.top=(cy-50)+'px';seat.dataset.playerId='p'+i;seat.innerHTML='<div class="table-player-cards">A K</div><div class="avatar"></div><div class="table-player-name"><a href="/players/p'+i+'"><span class="name-text">Player '+i+'</span><span class="badge">★</span></a></div><div class="table-player-stack">1000</div><span class="action-fold">FOLD</span><span class="trophy">♜</span>';seatRoot.append(seat);let hud=document.createElement('div');hud.id='pnhud-fixture-'+i;hud.className='pnhud-seat-overlay';hud.dataset.pnhudPlayerId='p'+i;hud.innerHTML='<button class="pnhud-overlay-grip" aria-label="Drag Player '+i+'"><span></span></button><button class="pnhud-player-name">P'+i+'</button><span>H 159 · VPIP 42 · PFR 20</span>';root.append(hud);let rec={element:hud,entry:{playerId:'p'+i,seatId:'s'+i,rect:seat.getBoundingClientRect()}};api.records.set('p'+i,rec);api.install(hud,'p'+i);}layout();}
function layout(){if(!api)return;let entries=[],sizes={};api.records.forEach((rec,id)=>{let seat=seatRoot.querySelector('[data-player-id="'+id+'"]'),visual=api.resolve(seat,'Player '+id.slice(1),1000);rec.entry={playerId:id,seatId:'s'+id,rect:seat.getBoundingClientRect(),visualRect:visual.rect,visualAnchorSource:visual.source};rec.visual=visual;entries.push(rec.entry);sizes[id]={width:rec.element.offsetWidth,height:rec.element.offsetHeight};});let placed=PokerSeatOverlay.layoutCanonicalSeatHudOverlays(entries,sizes,{width:innerWidth,height:innerHeight},api.offsets());api.records.forEach((rec,id)=>{let p=placed.placements.get(id);rec.lastPlacement=p;rec.canonicalPlacement=p.canonicalRect;rec.element.style.transform='translate3d('+p.left+'px,'+p.top+'px,0)';});api.layer();output();}
function hide(){expanded.hidden=true;menu.hidden=true;active=null;api.layer();output();}
function show(type){hide();active=type==='menu'?menu:expanded;active.hidden=false;active.scrollTop=0;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===type)));let r=active.getBoundingClientRect(),rec=api.records.get('p0');api.offsets().p0={offsetX:r.right-95-rec.canonicalPlacement.left,offsetY:r.top+112-rec.canonicalPlacement.top};layout();}
function verify(ok,label){if(!ok)throw Error(label);}
function matrix(){checks=[];try{hide();for(let n of [2,3,4,6,9]){render(n);api.reset('matrix reset');for(let rec of api.records.values()){let v=rec.visual.rect,p=rec.lastPlacement;verify(Math.abs(p.canonicalRect.left+95-v.centerX)<.01,'center');verify(p.canonicalRect.top===v.bottom+8,'gap');verify(rec.visual.reference.nameTextRect.width<rec.entry.rect.width/2,'wrapper excluded');}checks.push('PASS '+n+' seats: painted identity / 8px / asymmetry');}for(let type of ['Session Log','Ledger','Replayer','menu']){for(let cycle=0;cycle<3;cycle++){show(type);let before=JSON.stringify(api.records.get('p0').lastPlacement),p=active.getBoundingClientRect(),hit=document.elementFromPoint(p.right-10,p.top+125),outside=document.elementFromPoint(p.right+10,p.top+125);verify(active.contains(hit),type+' overlap hit');verify(root.contains(outside),type+' outside hit');verify(!api.state().blocked,type+' no root suppression');hide();verify(JSON.stringify(api.records.get('p0').lastPlacement)===before,type+' no drift');}checks.push('PASS '+type+': nested context / hit / outside / 3 cycles');}api.reset('matrix final reset');let rec=api.records.get('p0'),before=rec.visual.rect.centerX,node=seatRoot.querySelector('.name-text');node.outerHTML='<span class="name-text" style="position:relative;left:-17px">Player 0</span>';layout();verify(Math.abs(api.records.get('p0').visual.rect.centerX-before+17)<.01,'remount');checks.push('PASS replacement name remeasured; reset offsets 0/0');document.getElementById('settings').hidden=false;api.settings(true);api.layer();verify(api.state().blocked,'extension settings');document.getElementById('settings').hidden=true;api.settings(false);document.getElementById('game-settings').hidden=false;api.layer();verify(api.state().blocked,'game settings');document.getElementById('game-settings').hidden=true;layout();checks.push('PASS both settings blockers; frozen source/layout state');}catch(e){checks.push('FAIL '+e.message);}output();}
document.getElementById('run').onclick=matrix;document.getElementById('count').onchange=e=>{hide();render(Number(e.target.value));};document.getElementById('reset').onclick=()=>{api.reset('browser reset');output();};document.getElementById('remount').onclick=()=>{let node=seatRoot.querySelector('.name-text');shift-=15;node.outerHTML='<span class="name-text" style="position:relative;left:'+shift+'px">Player 0</span>';layout();};document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>show(b.dataset.panel));document.getElementById('close').onclick=hide;document.querySelectorAll('.native-close').forEach(b=>b.onclick=hide);document.querySelectorAll('.native-action,.bottom-action').forEach(b=>b.onclick=()=>{clicks++;output();});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));document.getElementById('settings-toggle').onclick=()=>{let el=document.getElementById('settings');el.hidden=!el.hidden;api.settings(!el.hidden);api.layer();output();};document.getElementById('game-toggle').onclick=()=>{let el=document.getElementById('game-settings');el.hidden=!el.hidden;api.layer();output();};expanded.onscroll=output;menu.onscroll=output;window.addEventListener('resize',()=>render(count));new MutationObserver(()=>{api.layer();output();}).observe(document.getElementById('native-app'),{childList:true,subtree:true,attributes:true,attributeFilter:['class','hidden','aria-selected']});matrix();
</script></body></html>
