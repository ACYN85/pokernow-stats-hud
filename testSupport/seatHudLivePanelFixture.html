<!doctype html><html><head><meta charset="utf-8"><title>Synthetic PokerNow panel-body centering regression</title><link rel="stylesheet" href="/hud.css"><style>
*{box-sizing:border-box}body{margin:0;background:#174438;color:white;font:14px Arial}header{position:fixed;inset:0 0 auto;background:#102820;padding:8px;z-index:2147483647}button{padding:6px;cursor:pointer}.table-player{position:absolute;width:230px;height:82px}.table-player-infos-ctn{position:relative;width:230px;height:82px;background:rgba(51,51,51,.76);border-radius:7px;overflow:hidden}.infos-ctn-container{height:0}.table-player-name{position:absolute;left:52%;right:3%;top:20px;height:21px;display:flex;overflow:hidden;white-space:nowrap}.table-player-name a{color:#eee;font-size:17px}.table-player-stack{position:absolute;left:52%;top:41px;height:19px;margin:0;color:white;white-space:nowrap}.table-player-status-icon{position:absolute;z-index:2;left:10px;top:14px;width:98px;height:60px;text-align:center;margin:0;font-size:11px;pointer-events:none}.table-player-status-icon:before{content:'♟';display:block;font-size:34px}.player-table-signals-container{position:absolute;z-index:3;right:-7px;top:-7px;display:flex;background:#777;border-radius:12px;padding:3px 7px;font-size:11px;gap:6px}.table-player-cards{position:absolute;left:-25px;top:-20px;width:85px;height:70px;border:2px solid #e4e1bb;background:#d6cfb3;z-index:1;display:none}.avatar .table-player-cards{display:block;left:-18px;top:-25px;width:90px;height:98px;background:#727ea7;border-radius:30px}.active .table-player-cards{display:block}.emoji-container{position:absolute;top:100px;right:-100px;color:#dfd09b}.pnhud-seat-overlay{width:190px!important;height:32px!important}#results{position:fixed;left:0;bottom:0;z-index:2147483647;pointer-events:none;background:#102820;white-space:pre-wrap;font:11px monospace;padding:7px;max-width:100%}
</style></head><body><header><button id="run">Run panel matrix</button><button id="reset">Reset HUD offsets</button><button id="offset">Apply test offset</button><button id="remount">Replace panel body</button></header><main id="seats"></main><div id="pnhud-overlay-root"></div><output id="results"></output>
<script src="/playerProfileClassifier.js"></script><script src="/playerProfilePresentation.js"></script><script src="/playerProfileExplanation.js"></script><script src="/overlayStats.js"></script><script src="/seatOverlay.js"></script><script src="/runtime.js"></script><script>
const seatRoot=document.getElementById('seats'),root=document.getElementById('pnhud-overlay-root'),out=document.getElementById('results');let api,checks=[];
function report(){const rows=[...api.records].filter(([id,r])=>r.lastPlacement).map(([id,r])=>{const c=r.lastPlacement.canonicalRect||r.canonicalPlacement;return {id,source:r.visual.playerPanelBodySource,canonicalCenter:c.left+95,canonicalTop:c.top,panelBottom:r.visual.rect.bottom,renderedTop:r.lastPlacement.top,clamped:r.lastPlacement.viewportClampApplied};});out.textContent=checks.join('\n')+'\nOffsets '+JSON.stringify(api.offsets())+'\n'+JSON.stringify(rows);}
api=createSeatHudFixtureRuntime(root,()=>layout(),()=>report());
function layout(){let entries=[],sizes={};for(let [id,r] of api.records){let s=seatRoot.querySelector('[data-player-id="'+id+'"]');r.visual=api.resolve(Number(id.slice(1))%2?s.querySelector('.table-player-name'):s,s.dataset.name,264.33);r.entry={playerId:id,seatId:id,rect:s.getBoundingClientRect(),visualRect:r.visual.rect};entries.push(r.entry);sizes[id]={width:190,height:32};}let positions=PokerSeatOverlay.layoutCanonicalSeatHudOverlays(entries,sizes,{width:innerWidth,height:innerHeight},api.offsets());for(let [id,r] of api.records){r.lastPlacement=positions.placements.get(id);r.canonicalPlacement=r.lastPlacement.canonicalRect;r.element.style.transform='translate3d('+r.lastPlacement.left+'px,'+r.lastPlacement.top+'px,0)';}report();}
function render(n){seatRoot.innerHTML='';root.innerHTML='';api.records.clear();for(let i=0;i<n;i++){let s=document.createElement('div'),name=['PlayerA','PlayerB','PlayerC','A long username','M','Player Six'][i%6],state=['active','folded','offline','away','in-next-hand','avatar'][i%6];s.className='table-player table-player-'+(i+1)+' '+state;s.dataset.playerId='p'+i;s.dataset.name=name;s.style.left=(70+i%3*370)+'px';s.style.top=([115,365,innerHeight-105][Math.floor(i/3)%3])+'px';s.innerHTML='<div class="player-table-signals-container top"><span class="win-count">21 ♜</span><span class="rebuy-count">2 ↻</span></div><div class="emoji-container">outside action bubble</div><div class="table-player-cards"></div><p class="table-player-status-icon">'+state+'</p><div class="player-table-signals-container bottom" hidden></div><div class="table-player-infos-ctn"><div class="infos-ctn-container"><div class="table-player-name"><span><a href="/players/p'+i+'">'+name+'</a></span></div><p class="table-player-stack"><span class="chips-value"><span class="normal-value">'+(i%2?'999999.99':'264.33')+'</span></span></p></div></div>';seatRoot.append(s);let h=document.createElement('div');h.id='pnhud-panel-'+i;h.className='pnhud-seat-overlay';h.dataset.pnhudPlayerId='p'+i;h.innerHTML='<button class="pnhud-overlay-grip" aria-label="Drag '+name+'"></button><button class="pnhud-player-name">'+name+'</button><span>H 159 / VPIP 42</span>';root.append(h);api.records.set('p'+i,{element:h});api.install(h,'p'+i);}layout();}
function verify(ok,message){if(!ok)throw Error(message);}
function check(){for(let [id,r] of api.records){let s=seatRoot.querySelector('[data-player-id="'+id+'"]'),panel=s.querySelector('.table-player-infos-ctn').getBoundingClientRect(),range=document.createRange();range.selectNodeContents(s.querySelector('a'));let name=range.getBoundingClientRect(),p=r.lastPlacement,hr=r.element.getBoundingClientRect();verify(Math.abs(name.left+name.width/2-panel.left-panel.width/2)>5,id+' asymmetric name');verify(r.visual.playerPanelBodySource==='live_panel',id+' direct live body');verify(Math.abs(p.canonicalRect.left+95-panel.left-panel.width/2)<.01,id+' panel center');verify(Math.abs(p.canonicalRect.top-panel.bottom-8)<.01,id+' panel bottom');if(!p.viewportClampApplied&&!p.manual){verify(Math.abs(hr.left+hr.width/2-panel.left-panel.width/2)<=.51,id+' rendered X');verify(Math.abs(hr.top-panel.bottom-8)<=.51,id+' rendered Y');}}}
function matrix(){checks=[];try{for(let n of [2,3,4,6,9]){render(n);api.reset('live-derived matrix reset');check();checks.push('PASS '+n+' seats: name != panel; HUD == panel; gap 8');}api.offsets().p0={offsetX:31,offsetY:-9};layout();let p=api.records.get('p0').lastPlacement;verify(p.requestedRect.left-p.canonicalRect.left===31&&p.requestedRect.top-p.canonicalRect.top===-9,'manual offsets');api.reset('final matrix reset');check();verify(api.records.get('p6').lastPlacement.viewportClampApplied,'bottom clamp');checks.push('PASS active/folded/away/offline/next-hand/avatar; decorations excluded');checks.push('PASS narrow identity anchors, offsets, reset, canonical vs rendered clamp');}catch(e){checks.push('FAIL '+e.message);}report();}
document.getElementById('run').onclick=matrix;document.getElementById('reset').onclick=()=>{api.reset('browser reset');check();checks.push('PASS actual Reset offsets 0/0');report();};document.getElementById('offset').onclick=()=>{api.offsets().p0={offsetX:31,offsetY:-9};layout();};document.getElementById('remount').onclick=()=>{let old=seatRoot.querySelector('.table-player-infos-ctn'),before=api.records.get('p0').canonicalPlacement,p=old.cloneNode(true);p.style.width='250px';p.style.height='97px';p.style.left='12px';p.style.top='10px';old.replaceWith(p);layout();let after=api.records.get('p0').canonicalPlacement;verify(!old.isConnected&&after.left-before.left===22&&after.top-before.top===25,'panel remount');check();checks.push('PASS panel remount X +22 / Y +25');report();};window.addEventListener('resize',layout);matrix();
</script></body></html>
