<!doctype html><html><head><meta charset="utf-8"><title>Seat HUD independent center / panel-bottom verification</title><link rel="stylesheet" href="/hud.css"><style>
*{box-sizing:border-box}body{margin:0;background:#163c31;color:white;font:13px system-ui}header{position:fixed;inset:0 0 auto;z-index:2147483647;padding:8px;background:#102820}button{padding:6px;cursor:pointer}.seat{position:absolute;width:440px;height:340px}.table-player-panel{position:absolute;left:0;top:0;width:160px;height:138px;background:#324b46;border:2px solid #9fb8aa;border-radius:10px}.table-player-panel.folded{background:#40474d}.table-player-name{position:absolute;left:0;top:53px;width:240px;height:28px}.table-player-name a{display:block;width:225px;padding-left:12px;color:white}.table-player-stack{position:absolute;left:0;top:82px;width:150px;height:28px;text-align:right;padding-right:18px}.table-player-cards{position:absolute;left:15px;top:4px;width:72px;height:44px;background:#e8e6d1;color:#162a20;text-align:center;font-size:24px;border-radius:5px}.custom-avatar{position:absolute;left:-30px;top:-10px;width:130px;height:200px;background:#65728e;border:3px solid #b9c7dd;border-radius:30px;display:none}.avatar-seat .custom-avatar{display:block}.avatar-seat .table-player-cards,.folded .table-player-cards{display:none}.cards-seat .table-player-cards{height:170px}.badge{position:absolute;left:250px;top:220px;color:gold}.action-animation{position:absolute;left:285px;top:300px}.trophy{position:absolute;left:-70px;top:280px}.name-label{position:relative}.pnhud-seat-overlay{width:190px!important;height:32px!important}#results{position:fixed;bottom:0;left:0;z-index:2147483647;white-space:pre;background:#102820;padding:8px;pointer-events:none;font:11px monospace}
</style></head><body><header><button id="run">Run geometry matrix</button><button id="reset">Reset offsets</button><button id="offset">Apply manual offset</button><button id="remount">Replace player panel</button></header><main id="seats"></main><div id="pnhud-overlay-root"></div><output id="results"></output>
<script src="/playerProfileClassifier.js"></script><script src="/playerProfilePresentation.js"></script><script src="/playerProfileExplanation.js"></script><script src="/overlayStats.js"></script><script src="/seatOverlay.js"></script><script src="/runtime.js"></script><script>
const seatRoot=document.getElementById('seats'),root=document.getElementById('pnhud-overlay-root'),out=document.getElementById('results');let api,checks=[];
function report(){out.textContent=checks.join('\n')+'\nOffsets '+JSON.stringify(api.offsets())+'\n'+JSON.stringify([...api.records].filter(([id,r])=>r.lastPlacement).map(([id,r])=>({id,center:r.lastPlacement.canonicalRect.left+95,top:r.lastPlacement.canonicalRect.top,panelBottom:r.visual.verticalPanelRect.bottom,renderedTop:r.lastPlacement.top,clamped:r.lastPlacement.viewportClampApplied})));}
api=createSeatHudFixtureRuntime(root,()=>layout(),()=>report());
function layout(){let entries=[],sizes={};for(let [id,r] of api.records){let seat=seatRoot.querySelector('[data-player-id="'+id+'"]');r.visual=api.resolve(seat,seat.dataset.name,1000);r.entry={playerId:id,seatId:id,rect:seat.getBoundingClientRect(),visualRect:r.visual.rect};entries.push(r.entry);sizes[id]={width:190,height:32};}let result=PokerSeatOverlay.layoutCanonicalSeatHudOverlays(entries,sizes,{width:innerWidth,height:innerHeight},api.offsets());for(let [id,r] of api.records){r.lastPlacement=result.placements.get(id);r.canonicalPlacement=r.lastPlacement.canonicalRect;r.element.style.transform='translate3d('+r.lastPlacement.left+'px,'+r.lastPlacement.top+'px,0)';}report();}
function render(n){seatRoot.innerHTML='';root.innerHTML='';api.records.clear();for(let i=0;i<n;i++){let s=document.createElement('section'),kind=['active','folded','avatar-seat','cards-seat','long-name'][i%5],name=i%5===4?'PlayerC with a long name':'PlayerC '+i;s.className='seat';s.dataset.playerId='p'+i;s.dataset.name=name;s.style.left=(70+(i%3)*370)+'px';s.style.top=([95,340,innerHeight-125][Math.floor(i/3)%3])+'px';s.innerHTML='<div class="table-player-panel '+kind+'"><div class="custom-avatar"></div><div class="table-player-cards">A K</div><div class="table-player-name"><a href="/players/p'+i+'"><span class="name-label">'+name+'</span><span class="badge">★</span></a></div><div class="table-player-stack">1000</div></div><span class="action-animation">FOLD / ACTION</span><span class="trophy">♜</span>';seatRoot.append(s);let hud=document.createElement('div');hud.id='pnhud-geometry-'+i;hud.className='pnhud-seat-overlay';hud.innerHTML='<button class="pnhud-overlay-grip" aria-label="Drag '+name+'"></button><button class="pnhud-player-name">'+name+'</button><span>H 159 / VPIP 42</span>';root.append(hud);api.records.set('p'+i,{element:hud});api.install(hud,'p'+i);}layout();}
function verify(ok,message){if(!ok)throw Error(message);}
function check(){for(let [id,r] of api.records){let s=seatRoot.querySelector('[data-player-id="'+id+'"]'),range=document.createRange();range.selectNodeContents(s.querySelector('.name-label'));let name=range.getBoundingClientRect(),bottom=Math.max(...[...s.querySelectorAll('.table-player-panel,.table-player-name,.table-player-stack,.custom-avatar,.table-player-cards')].filter(e=>getComputedStyle(e).display!=='none').map(e=>e.getBoundingClientRect().bottom));verify(Math.abs(r.lastPlacement.canonicalRect.left+95-(name.left+name.width/2))<.01,id+' X');verify(Math.abs(r.lastPlacement.canonicalRect.top-bottom-8)<.01,id+' complete panel bottom');verify(r.lastPlacement.canonicalRect.top>s.querySelector('.table-player-stack').getBoundingClientRect().bottom,id+' stack clearance');verify(r.visual.horizontalVisualRect!==r.visual.verticalPanelRect,id+' independent rectangles');}}
function matrix(){checks=[];try{for(let n of [2,3,4,6,9]){render(n);api.reset('geometry matrix reset');check();checks.push('PASS '+n+' seats: independent X / full panel bottom +8 / reset');}verify(api.records.get('p6').lastPlacement.viewportClampApplied,'bottom rendering clamp');api.offsets().p0={offsetX:31,offsetY:-9};layout();let p=api.records.get('p0').lastPlacement;verify(p.requestedRect.left-p.canonicalRect.left===31&&p.requestedRect.top-p.canonicalRect.top===-9,'offset preservation');api.reset('geometry final reset');check();checks.push('PASS active/folded/large-avatar/cards/long-name/stack/badge/action');checks.push('PASS offsets, reset, bottom-seat canonical remains below panel');}catch(e){checks.push('FAIL '+e.message);}report();}
document.getElementById('run').onclick=matrix;document.getElementById('reset').onclick=()=>{api.reset('browser reset');check();checks.push('PASS actual reset');report();};document.getElementById('offset').onclick=()=>{api.offsets().p0={offsetX:31,offsetY:-9};layout();};document.getElementById('remount').onclick=()=>{let old=seatRoot.querySelector('.table-player-panel'),r=api.records.get('p0'),before=r.lastPlacement.canonicalRect,p=old.cloneNode(true);p.style.height='173px';p.querySelector('.name-label').style.left='12px';old.replaceWith(p);layout();let after=api.records.get('p0').lastPlacement.canonicalRect;verify(!old.isConnected&&Math.abs(after.left-before.left-12)<.01&&Math.abs(after.top-before.top-35)<.01,'current remount X/Y');check();checks.push('PASS real node replacement: X +12 / Y +35');report();};window.addEventListener('resize',layout);matrix();
</script></body></html>
